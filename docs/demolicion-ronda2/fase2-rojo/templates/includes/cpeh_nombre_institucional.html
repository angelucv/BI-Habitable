{% load static %}
<div class="cpeh-institutional-name{% if compact %} cpeh-institutional-name--compact{% endif %}">
  {% if show_logo %}
  <img
    src="{% static 'img/logo-cpeh-redes.svg' %}"
    alt="Comisión Presidencial para la Evaluación de Habitabilidad de Infraestructuras"
    class="cpeh-institutional-logo{% if compact %} cpeh-institutional-logo--sm{% endif %}"
    width="{% if compact %}56{% else %}104{% endif %}"
    height="{% if compact %}56{% else %}104{% endif %}"
  >
  {% endif %}
  <div class="cpeh-institutional-text">
    <p class="cpeh-name-lg mb-0"><span class="cpeh-name-star" aria-hidden="true">★</span> Comisión</p>
    <p class="cpeh-name-lg mb-0">Presidencial</p>
    <p class="cpeh-name-sm mb-0">para la Evaluación</p>
    <p class="cpeh-name-sm mb-0">de Habitabilidad</p>
    <p class="cpeh-name-sm mb-0">de Infraestructuras</p>
  </div>
</div>
